# .github/workflows/ci.yml
#
# CI for the dns_server project. Place at .github/workflows/ci.yml in the repo.
#
# All jobs are blocking: build + sanitizer + smoke test, warnings-as-errors
# (curated set + -Werror), static analysis (scan-build + cppcheck), clang-format,
# and two 60s fuzz smokes (name_from_wire + resolverd response parser). The tree
# is clean against all of them;
# keep it that way (format new code with clang-format, fix warnings, add
# cppcheck inline-suppr only with justification).
#
# OpenSSL paths: libssl-dev on Ubuntu puts headers in /usr/include and the
# libraries in /usr/lib/x86_64-linux-gnu. The Makefile derives these via
# pkg-config now, but CI pins them explicitly since the runner image is fixed.

name: CI

on:
  push:
  pull_request:

env:
  OSSL_INC: /usr/include
  OSSL_LIB: /usr/lib/x86_64-linux-gnu

jobs:
  build-test:
    name: Build + sanitizer compile + smoke test
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libseccomp-dev clang dnsutils python3

      - name: Build debug (ASan + UBSan) — compile/link check
        run: make debug OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Build production binaries (unsigned)
        # Build the binary targets directly, not `prod`, to skip GPG signing
        # (no signing key in CI; signing belongs to the release pipeline).
        # Every daemon split out by the migration is built here.
        run: |
          make dns_server OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make certd      OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make mdnsd      OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make apid       OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make resolverd  OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Unit tests (DNSSEC known-answer/negative + name parser + wire conformance)
        run: |
          make check-dnssec           OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make check-wire             OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make check-conformance      OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make check-svcb             OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          make check-aggressive-nsec  OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 8976 ZONEMD (codec KAT + independent AXFR digest recompute)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-zonemd OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 7477 CSYNC (codec KAT + dnsd serves type 62)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-csync OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 5782 DNSxL synthesis (listed→A 127.0.0.x + TXT; unlisted→NXDOMAIN)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-dnsxl OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 1794 per-name round-robin rotation (RRSIGs intact)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-rr-rotate OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 6116/6117/6118 ENUM NAPTR (ordered rules, '|' in regexp, RRSIG)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-enum OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 2317 classless in-addr.arpa delegation (CNAME chain + RRSIG)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-2317 OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9660 ZONEVERSION EDNS option (echoes zone SOA serial)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-zoneversion OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9103 XoT — 'dot' ALPN actually selected on the DoT/XFR listener
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-xot OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9859 generalized NOTIFY (CDS/CDNSKEY to a parent on KSK rollover)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-parent-notify OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9567 DNS Error Reporting (EDNS0 Report-Channel option)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-error-reporting OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 3258/4892 CHAOS id.server/hostname.bind (anycast debugging aid)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-id-server OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9773 ACME Renewal Information (ARI) drives certd's renewal decision
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ari OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Smoke test against Valkey
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: |
          ./dns_server &
          SRV=$!
          sleep 2
          dig @127.0.0.1 -p 5353 example.local A +time=2 +tries=1 +short || true
          kill "$SRV" 2>/dev/null || true

      - name: Live DNSSEC DO-bit regression
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-dnssec-live OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 7344 CDS/CDNSKEY regression (CDS==DS, CDNSKEY==KSK)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-cds OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: resolverd caching proxy → dnsd
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-resolverd OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: "resolverd Valkey cache-load path (regression: NULL e->rrs crash)"
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-resolverd-cache OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: resolverd RFC 7873 DNS cookie exchange (BADCOOKIE retry)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-resolverd-cookie OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: resolverd RFC 5452 0x20 QNAME case randomization
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-dns0x20 OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: resolverd RFC 8767 serve-stale + RFC 9520 SERVFAIL caching
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-serve-stale OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: resolverd RFC 8914 Extended DNS Errors (KAT + live)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ede OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: resolverd RFC 7858 DoT server + RFC 9462 DDR
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ddr OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Out-of-zone forwarding (failover + TC→TCP + RFC 5452 anti-spoof)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-forwarder OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: A/AAAA load-balancing rotation
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-lb OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: A/AAAA load-balancing health checks (drop down addr, fail-open)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-lb-health OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: AXFR completeness (runtime zone:* / ddns:* records)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-axfr OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 1995 server IXFR (incremental diff framing + AXFR fallback)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ixfr OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 1982 serial-wrap IXFR decision (serial_lt, not raw <)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ixfr-wrap OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 1995 secondary IXFR (incremental apply via NOTIFY re-pull)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ixfr-client OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: mTLS on the DoT/transfer listener
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-dot-mtls OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: DDNS suffix ACL + serial-churn skip
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ddns-acl OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: PTR / reverse zones (serve + auto-PTR + AXFR + retract)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ptr OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9715 UDP fragmentation avoidance (1232 cap + TC fallback)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-frag OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: RFC 9077 negative-response TTL = min(SOA.MINIMUM, SOA-TTL)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-negttl OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: DDNS lease-expiry sweeper (silent expiry → serial bump + IXFR delete)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-ddns-sweeper OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: NOTIFY sender (TSIG-signed + retried until ACK)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-notify OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Secondary-role guards (UPDATE→NOTAUTH + no DNSSEC keygen)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-role OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Zone transfer client (secondary AXFR pull)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-xfr-client OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Secondary refresh (NOTIFY re-pull + SOA expire)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-xfr-refresh OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

      - name: Transfer TSIG (sign request + verify chained response)
        env:
          DNS_VALKEY_HOST: 127.0.0.1
          DNS_VALKEY_PORT: 6379
        run: make check-xfr-tsig OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB

  warnings:
    name: Warnings as errors
    runs-on: ubuntu-latest
    # Blocking: the tree is warning-clean under the curated set + -Werror
    # (verified green in CI run 27550875223).
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libseccomp-dev
      - name: Build with the curated warning set promoted to errors
        # EXTRA_WARN=-Werror keeps the project's curated WARN flags (incl. the
        # intentional -Wno-* for the legacy dense code) and turns them fatal —
        # CLAUDE.md: "promote the current warning set", not bare -Wall -Wextra.
        run: |
          set -e
          for t in dns_server certd mdnsd apid resolverd; do
            make "$t" EXTRA_WARN=-Werror OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          done
          make debug EXTRA_WARN=-Werror OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
          # Standalone translation units have no daemon target; syntax-check
          # them under the same flags at -O2 (surfaces format-truncation etc.).
          # resolverd now has its own -Werror target above, so only the reference
          # build (simple_dns.c) remains here.
          W="-Wall -Wextra -Wformat=2 -Wformat-overflow=2 -Wnull-dereference \
             -Wstack-protector -Wno-unused-parameter -Wno-missing-field-initializers \
             -Wno-implicit-fallthrough -Werror"
          gcc -std=c99 -D_GNU_SOURCE -O2 -D_FORTIFY_SOURCE=2 -fPIE $W \
              -I"$OSSL_INC" -fsyntax-only simple_dns.c

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    # Blocking: scan-build reports no bugs and cppcheck is clean
    # (verified green in CI run 27553189061).
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools clang-tidy cppcheck libssl-dev libseccomp-dev
      - name: clang static analyzer (scan-build)
        run: scan-build --status-bugs make dns_server OSSL_INC=$OSSL_INC OSSL_LIB=$OSSL_LIB
      - name: cppcheck
        run: cppcheck --enable=warning,portability --inline-suppr --error-exitcode=1 *.c

  format:
    name: clang-format
    runs-on: ubuntu-latest
    # Blocking: the tree was reflowed with .clang-format and verified clean in
    # CI (run 27550875223). Keep new code formatted (`clang-format -i`).
    #
    # clang-format is PINNED to 20.1.8 via the PyPI wheel rather than installed
    # from apt. The apt `clang-format` package floats with the runner image
    # (it was v18 here) and v18's trailing-comment alignment differs from v20+,
    # which silently broke this job from PR #17 on even though the tree was clean
    # under the newer clang-format used locally. Pinning makes CI and local dev
    # agree byte-for-byte — install the same version locally with
    #   pipx install clang-format==20.1.8
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format (pinned — see comment above)
        run: pipx install "clang-format==20.1.8"
      - name: Check formatting
        run: |
          clang-format --version
          files=$(git ls-files '*.c' '*.h')
          [ -z "$files" ] || clang-format --dry-run --Werror $files

  fuzz-smoke:
    name: Fuzz smoke (name_from_wire)
    runs-on: ubuntu-latest
    # libdnswire + the harness landed in migration Step 1, so this always runs.
    # (A job-level `if:` may not call hashFiles() — that is only valid in step
    # contexts — so the old self-activation guard made the whole workflow
    # invalid; the files are committed now, so no guard is needed.)
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: Build fuzzer
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -I. \
                fuzz/fuzz_name_from_wire.c dns_wire.c -o fuzz_name_from_wire \
                -lssl -lcrypto
      - name: Run 60s smoke + replay regression corpus
        run: |
          mkdir -p fuzz/corpus
          ./fuzz_name_from_wire -max_total_time=60 fuzz/corpus

  fuzz-response-smoke:
    name: Fuzz smoke (resolverd response parser)
    runs-on: ubuntu-latest
    # libFuzzer over resolverd's untrusted upstream-response parsers
    # (response_opt_parse / response_matches_query / parse_response_to_entry).
    # The harness #includes resolverd.c (main gated by UNIT_TEST), so it links
    # OpenSSL + pthread like resolverd itself.
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: Build fuzzer
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -DUNIT_TEST -I. \
                -Wno-unused-function \
                fuzz/fuzz_response.c dns_wire.c sandbox.c -o fuzz_response \
                -lssl -lcrypto -lpthread
      - name: Run 60s smoke + replay regression corpus
        run: |
          mkdir -p fuzz/corpus_response
          ASAN_OPTIONS=detect_leaks=1 ./fuzz_response -max_total_time=60 fuzz/corpus_response

  fuzz-tlv-smoke:
    name: Fuzz smoke (TLV codec)
    runs-on: ubuntu-latest
    # libFuzzer over the ADR-003 length-prefixed TLV codec (dns_wire.c) — the
    # structured encoding for complex Valkey values. Reader parses untrusted
    # inter-daemon-bus bytes; this proves it stays in bounds.
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev
      - name: Build fuzzer
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -I. \
                fuzz/fuzz_tlv.c dns_wire.c -o fuzz_tlv \
                -lssl -lcrypto
      - name: Run 60s smoke + replay regression corpus
        run: |
          mkdir -p fuzz/corpus_tlv
          ASAN_OPTIONS=detect_leaks=1 ./fuzz_tlv -max_total_time=60 fuzz/corpus_tlv
